name: Deploy production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vandijkrijschool
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    if: github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://vandijkrijschool.nl
    runs-on:
      - self-hosted
      - Linux
      - X64
      - dg-sites
      - production
      - vandijkrijschool
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://vandijkrijschool.nl
      NEXT_PUBLIC_INDEXING_ENABLED: "false"
      APP_ENVIRONMENT: production
      APP_REVISION: ${{ github.sha }}
      DG_RUNTIME_ENV_KEYS: >-
        NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_INDEXING_ENABLED APP_ENVIRONMENT APP_REVISION

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify dedicated runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "vandijkrijschool"
          test "${RUNNER_NAME:-}" = "dg-sites-vps-01-vandijkrijschool-01"
          [[ "${GITHUB_WORKSPACE}" == /srv/sites/vandijkrijschool/actions-runner/_work/* ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate production configuration
        run: npm run validate:production-env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build standalone application
        run: npm run build

      - name: Smoke-test standalone application
        run: npm run test:smoke

      - name: Browser, responsive and accessibility interaction QA
        run: npm run test:browser

      - name: Deploy through the Sites VPS interface
        run: |
          /usr/local/bin/dg-site-deploy \
            vandijkrijschool \
            "${GITHUB_WORKSPACE}" \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Verify public production
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://vandijkrijschool.nl/api/health)"
          HEALTH_JSON="${health}" node --input-type=module <<'NODE'
          const health = JSON.parse(process.env.HEALTH_JSON);
          if (
            health.status !== "ok" ||
            health.service !== "vandijkrijschool" ||
            health.environment !== "production" ||
            health.revision !== process.env.GITHUB_SHA
          ) throw new Error("The public health response does not match the deployed revision.");
          NODE
          html="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://vandijkrijschool.nl/)"
          [[ "${html}" == *"Van Dijk Rijschool"* ]]
          [[ "${html}" == *"noindex"* ]]
